<!DOCTYPE html>
<html>
<head>
<title>My Ammadi ❤️</title>
<style>
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(to right, #ff758c, #ff7eb3);
  color: white;
  text-align: center;
}
.container {
  margin-top: 60px;
}
img {
  width: 260px;
  border-radius: 20px;
  box-shadow: 0 0 25px rgba(0,0,0,0.5);
}
h1 {
  font-size: 42px;
}
p {
  font-size: 20px;
  margin: 20px;
}
.heart {
  font-size: 30px;
  animation: beat 1s infinite;
}
@keyframes beat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}
</style>
</head>
<body>

<div class="container">
  <h1>My Ammadi ❤️</h1>

  <img src="love.jpg" alt="Us">
  style="width:250px; border-radius:20px;">

  <p>Without you, I am nothing.</p>
  <p>You are my world, Vennela.</p>
  <p>Every heartbeat of mine says your name.</p>
  <p>I love you more than anything in this world.</p>

  <div class="heart">❤️</div>
</div>

</body>
</html>
